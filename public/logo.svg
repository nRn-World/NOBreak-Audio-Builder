<svg width="240" height="80" viewBox="0 10 240 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgba(255,255,255,0.6);stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background/Border Area (Dark like the app) -->
  <rect x="5" y="15" width="230" height="60" rx="8" fill="#0A0A0B" stroke="white" stroke-opacity="0.1" />
  
  <!-- Icon Group -->
  <g transform="translate(25, 33)">
    <!-- Top Wave (Pink) -->
    <path d="M0 6 Q 2.5 1, 5 6 T 10 6 T 15 6 T 20 6" fill="none" stroke="#ec4899" stroke-width="2" />
    <!-- Bottom Wave (Teal, rotated) -->
    <path d="M0 16 Q 2.5 21, 5 16 T 10 16 T 15 16 T 20 16" fill="none" stroke="#06b6d4" stroke-width="2" />
  </g>
  
  <!-- Text Group -->
  <g transform="translate(60, 48)">
    <text x="0" y="0" font-family="Inter, sans-serif" font-weight="900" font-size="24" letter-spacing="-1" fill="url(#textGradient)">NOBREAK</text>
    <text x="0" y="14" font-family="Inter, sans-serif" font-weight="900" font-size="9" letter-spacing="3" fill="#a855f7">AUDIO BUILDER</text>
  </g>
</svg>
